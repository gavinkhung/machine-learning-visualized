services:
  jupyter-book:
    build:
      context: .
      dockerfile: Dockerfile.book
    container_name: jupyter-book
    command: bash -c "chmod +x ./download_notebooks.sh && ./download_notebooks.sh && jupyter-book build ."
    volumes:
      - .:/usr/src/app

  pandoc:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.pandoc
    container_name: pandoc-container
    volumes:
      - .:/data